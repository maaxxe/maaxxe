name: GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1) DASHBOARD PRINCIPAL
      # ============================================================
      - name: Main dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: maaxxe

          filename: metrics-main.svg
          template: classic

          config_timezone: Europe/Paris
          config_animations: yes
          config_display: columns

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          config_order: >
            base.header,
            languages,
            habits,
            topics,
            achievements,
            base.activity,
            base.repositories,
            base.metadata

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_ignored: >
            html, css, jupyter notebook

          # Habits
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes

          # Topics with icons
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 24

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 8

          plugins_errors_fatal: no

      # ============================================================
      # 2) CALENDRIER ISOMÉTRIQUE 3D
      # ============================================================
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: maaxxe

          filename: metrics-isocalendar.svg
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugins_errors_fatal: no

      # ============================================================
      # 3) PAGESPEED DE TON SITE github.io
      # ============================================================
      - name: PageSpeed website card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: maaxxe

          filename: metrics-pagespeed.svg
          base: ""

          plugin_pagespeed: yes
          plugin_pagespeed_url: https://maaxxe.github.io
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes

          plugins_errors_fatal: no

      # ============================================================
      # 4) SKYLINE 3D
      # ============================================================
      - name: Skyline
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: maaxxe

          filename: metrics-skyline.svg
          base: ""

          plugin_skyline: yes
          plugin_skyline_year: 2026
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.8

          plugins_errors_fatal: no
