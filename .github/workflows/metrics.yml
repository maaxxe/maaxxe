name: GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # GRAND DASHBOARD PRINCIPAL
      # ============================================================

      - name: Generate main dashboard
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: maaxxe

          filename: github-metrics.svg

          template: classic

          # Très important : rendu large en colonnes
          config_display: columns

          config_timezone: Europe/Paris
          config_animations: yes
          config_padding: 4%

          # --------------------------------------------------------
          # INFORMATIONS DE BASE
          # --------------------------------------------------------

          base: header, activity, community, repositories, metadata

          base_indepth: yes

          # --------------------------------------------------------
          # ORDRE DU DASHBOARD
          # --------------------------------------------------------

          config_order: >
            base.header,
            isocalendar,
            languages,
            habits,
            topics,
            achievements,
            base.activity,
            base.repositories,
            base.metadata

          # ========================================================
          # CALENDRIER 3D
          # ========================================================

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ========================================================
          # LANGAGES
          # ========================================================

          plugin_languages: yes

          plugin_languages_limit: 8

          plugin_languages_threshold: 1%

          plugin_languages_other: yes

          plugin_languages_details: percentage

          plugin_languages_sections: most-used

          plugin_languages_ignored: >
            HTML,
            CSS,
            Jupyter Notebook

          # Couleurs personnalisées
          plugin_languages_colors: >
            Python:#3572A5,
            C:#A8B9CC,
            C++:#00599C,
            Java:#B07219,
            JavaScript:#F1E05A,
            Shell:#89E051

          # ========================================================
          # CODING HABITS
          # ========================================================

          plugin_habits: yes

          # plus d'événements = stats plus précises
          plugin_habits_from: 500

          plugin_habits_days: 30

          plugin_habits_facts: yes

          plugin_habits_charts: yes

          # beaux graphes SVG
          plugin_habits_charts_type: graph

          plugin_habits_trim: yes

          plugin_habits_languages_limit: 8

          # ========================================================
          # STARRED TOPICS AVEC ICONES
          # ========================================================

          plugin_topics: yes

          # 0 = afficher tous les topics disponibles
          plugin_topics_limit: 0

          plugin_topics_mode: icons

          # ========================================================
          # ACHIEVEMENTS
          # ========================================================

          plugin_achievements: yes

          plugin_achievements_display: compact

          plugin_achievements_limit: 8

          # Ne pas faire planter tout le dashboard
          # si un plugin secondaire échoue
          plugins_errors_fatal: no


      # ============================================================
      # SECOND SVG : SKYLINE / CONTRIBUTIONS 3D
      # ============================================================

      - name: Generate skyline
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: maaxxe

          filename: metrics-skyline.svg

          base: ""

          plugin_skyline: yes

          plugin_skyline_year: 2026

          plugin_skyline_frames: 60

          plugin_skyline_quality: 0.8

          config_animations: yes

          plugins_errors_fatal: no


      # ============================================================
      # TROISIEME SVG : REPOSITORIES
      # ============================================================

      - name: Generate repositories
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: maaxxe

          filename: metrics-repositories.svg

          base: ""

          plugin_repositories: yes

          # Tes 6 repositories GitHub épinglés
          plugin_repositories_pinned: 6

          plugins_errors_fatal: no
