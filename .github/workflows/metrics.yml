name: GitHub Metrics

on:
  # Mise à jour automatique tous les jours
  schedule:
    - cron: "0 6 * * *"

  # Lancement manuel
  workflow_dispatch:

concurrency:
  group: github-profile-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest

        with:
          # ============================================================
          # COMPTE
          # ============================================================

          token: ${{ secrets.METRICS_TOKEN }}
          user: maaxxe


          # ============================================================
          # SORTIE
          # ============================================================

          filename: github-metrics.svg


          # ============================================================
          # APPARENCE
          # ============================================================

          template: classic
          config_display: columns
          config_timezone: Europe/Paris

          config_animations: yes
          config_twemoji: yes
          config_gemoji: yes
          config_octicon: yes


          # ============================================================
          # INFORMATIONS DU PROFIL
          # ============================================================

          base: header, activity, community, repositories, metadata

          repositories: 100
          repositories_forks: no
          repositories_affiliations: owner


          # ============================================================
          # CALENDRIER 3D DES CONTRIBUTIONS
          # ============================================================

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year


          # ============================================================
          # LANGAGES
          # ============================================================

          plugin_languages: yes

          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes

          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          plugin_languages_colors: rainbow


          # ============================================================
          # HABITUDES DE CODE
          #
          # Désactivé temporairement :
          # le plugin rencontre actuellement des erreurs avec certains
          # événements GitHub.
          # ============================================================

          plugin_habits: no


          # ============================================================
          # TECHNOLOGIES / TOPICS
          # ============================================================

          plugin_topics: yes

          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 20


          # ============================================================
          # LIGNES DE CODE
          # ============================================================

          plugin_lines: yes
          plugin_lines_sections: base


          # ============================================================
          # PLUGINS DÉSACTIVÉS EXPLICITEMENT
          # ============================================================

          plugin_pagespeed: no
          plugin_projects: no


          # ============================================================
          # ORDRE
          # ============================================================

          config_order: >
            base.header,
            isocalendar,
            topics,
            languages,
            base.repositories,
            base.activity,
            base.community,
            base.metadata
