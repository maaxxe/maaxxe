name: GitHub Metrics

on:
  # Mise à jour automatique tous les jours à 06:00 UTC
  schedule:
    - cron: "0 6 * * *"

  # Permet de lancer manuellement depuis GitHub Actions
  workflow_dispatch:

# Évite deux générations simultanées
concurrency:
  group: github-profile-metrics
  cancel-in-progress: true

permissions:
  contents: write


jobs:
  github-metrics:

    runs-on: ubuntu-latest

    steps:

      - name: Generate GitHub Metrics

        uses: lowlighter/metrics@latest

        with:

          # ============================================================
          # COMPTE / AUTHENTIFICATION
          # ============================================================

          token: ${{ secrets.METRICS_TOKEN }}

          user: maaxxe


          # ============================================================
          # FICHIER GÉNÉRÉ
          # ============================================================

          filename: github-metrics.svg


          # ============================================================
          # APPARENCE
          # ============================================================

          template: classic

          config_display: columns

          config_timezone: Europe/Paris

          config_animations: yes

          config_twemoji: yes

          config_gemoji: yes

          config_octicon: yes


          # ============================================================
          # INFORMATIONS GÉNÉRALES
          # ============================================================

          base: header, activity, community, repositories, metadata


          # ============================================================
          # REPOSITORIES
          #
          # Prend automatiquement en compte les repositories accessibles
          # avec METRICS_TOKEN.
          #
          # Cela inclut les repos privés SI le token possède les droits.
          # ============================================================

          repositories: 100

          repositories_forks: no

          repositories_affiliations: owner, collaborator


          # ============================================================
          # CALENDRIER DES CONTRIBUTIONS
          # ============================================================

          plugin_isocalendar: yes

          plugin_isocalendar_duration: full-year


          # ============================================================
          # LANGAGES
          #
          # Calculés automatiquement depuis les repositories.
          # Aucun langage écrit manuellement dans le README.
          # ============================================================

          plugin_languages: yes

          plugin_languages_limit: 10

          plugin_languages_threshold: 0%

          plugin_languages_other: yes

          plugin_languages_sections: most-used

          plugin_languages_details: percentage

          plugin_languages_colors: rainbow


          # ============================================================
          # TECHNOLOGIES / TOPICS
          #
          # Récupère automatiquement les topics de tes repositories.
          #
          # Exemple :
          # python
          # pytorch
          # computer-vision
          # robotics
          # gan
          # embedded
          # etc.
          # ============================================================

          plugin_topics: yes

          plugin_topics_mode: icons

          plugin_topics_sort: stars

          plugin_topics_limit: 20


          # ============================================================
          # LIGNES DE CODE
          # ============================================================

          plugin_lines: yes

          plugin_lines_sections: base


          # ============================================================
          # HABITUDES
          #
          # Désactivé pour l'instant car il générait
          # "Unexpected error".
          # ============================================================

          plugin_habits: no


          # ============================================================
          # PAGESPEED
          #
          # Désactivé pour supprimer l'erreur API 429.
          # ============================================================

          plugin_pagespeed: no


          # ============================================================
          # GITHUB PROJECTS
          #
          # Désactivé car il générait "Unexpected error".
          # ============================================================

          plugin_projects: no


          # ============================================================
          # ORDRE D'AFFICHAGE
          # ============================================================

          config_order: >
            base.header,
            isocalendar,
            languages,
            topics,
            base.repositories,
            base.activity,
            base.community,
            base.metadata
