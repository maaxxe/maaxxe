name: GitHub Metrics

on:
  # Mise à jour automatique une fois par jour
  schedule:
    - cron: "0 6 * * *"

  # Permet de lancer manuellement depuis GitHub Actions
  workflow_dispatch:

# Évite d'avoir plusieurs générations Metrics en même temps
concurrency:
  group: github-profile-metrics
  cancel-in-progress: true

permissions:
  contents: write


jobs:
  github-metrics:

    runs-on: ubuntu-latest

    steps:

      - name: Generate GitHub dashboard

        uses: lowlighter/metrics@latest

        with:

          # ============================================================
          # COMPTE / AUTHENTIFICATION
          # ============================================================

          token: ${{ secrets.METRICS_TOKEN }}

          user: maaxxe


          # ============================================================
          # FICHIER GÉNÉRÉ
          # ============================================================

          filename: github-metrics.svg


          # ============================================================
          # APPARENCE
          # ============================================================

          template: classic

          # Rend le dashboard en plusieurs colonnes,
          # comme sur ton image de référence
          config_display: columns

          config_timezone: Europe/Paris

          config_animations: yes

          config_twemoji: yes
          config_gemoji: yes
          config_octicon: yes

          # Un plugin secondaire ne doit pas faire échouer
          # tout le workflow
          plugins_errors_fatal: no


          # ============================================================
          # INFORMATIONS GITHUB PRINCIPALES
          # ============================================================

          base: header, activity, community, repositories, metadata

          base_indepth: yes

          repositories: 100

          repositories_forks: no

          repositories_affiliations: owner


          # ============================================================
          # ORDRE DES ÉLÉMENTS
          # ============================================================

          config_order: >
            base.header,
            pagespeed,
            isocalendar,
            habits,
            topics,
            languages,
            achievements,
            base.repositories,
            base.activity,
            base.community,
            base.metadata


          # ============================================================
          # LIGNES DE CODE
          #
          # Affiche :
          # xxx added
          # xxx removed
          # ============================================================

          plugin_lines: yes

          plugin_lines_sections: base

          plugin_lines_delay: 30


          # ============================================================
          # GOOGLE PAGESPEED
          #
          # Performance
          # Accessibility
          # Best Practices
          # SEO
          # ============================================================

          plugin_pagespeed: yes

          plugin_pagespeed_url: https://maaxxe.github.io/

          # Crée un secret PAGESPEED_TOKEN pour éviter l'erreur 429
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}

          # Comme ton image de référence :
          # uniquement les scores principaux
          plugin_pagespeed_detailed: no

          plugin_pagespeed_screenshot: no

          plugin_pagespeed_pwa: no


          # ============================================================
          # CALENDRIER DE CONTRIBUTIONS 3D
          # ============================================================

          plugin_isocalendar: yes

          plugin_isocalendar_duration: full-year


          # ============================================================
          # CODING HABITS
          #
          # Commit activity per time of day
          # Commit activity per day
          # Language activity
          # ============================================================

          plugin_habits: yes

          # Valeurs par défaut recommandées par Metrics
          # pour rester raisonnable et éviter les très longues analyses
          plugin_habits_from: 200

          plugin_habits_days: 14

          plugin_habits_facts: yes

          plugin_habits_charts: yes

          plugin_habits_charts_type: graph

          plugin_habits_trim: yes

          plugin_habits_languages_limit: 8

          plugin_habits_languages_threshold: 0%


          # ============================================================
          # TECHNOLOGIES / TOPICS AVEC ICÔNES
          #
          # C'est le bloc coloré proche de :
          #
          # Mastered technologies and topics
          # ============================================================

          plugin_topics: yes

          plugin_topics_mode: icons

          plugin_topics_sort: stars

          # Maximum documenté : 20
          plugin_topics_limit: 20


          # ============================================================
          # LANGAGES
          #
          # Grande barre multicolore + pourcentages
          # ============================================================

          plugin_languages: yes

          plugin_languages_limit: 8

          plugin_languages_threshold: 0%

          plugin_languages_other: yes

          plugin_languages_sections: most-used

          plugin_languages_details: percentage

          # Palette colorée officielle disponible dans Metrics
          plugin_languages_colors: rainbow


          # ============================================================
          # ACHIEVEMENTS
          # ============================================================

          plugin_achievements: yes

          plugin_achievements_display: compact

          plugin_achievements_limit: 8
